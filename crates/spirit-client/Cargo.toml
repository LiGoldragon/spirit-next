[package]
name = "spirit-client"
version = "0.27.0"
edition = "2024"
publish = false

[[bin]]
name = "spirit"
path = "src/main.rs"

[features]
testing-trace = ["spirit/testing-trace", "dep:signal-introspect"]

[dependencies]
spirit = { path = "../..", default-features = false, features = ["datom-cli"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad" }
signal-spirit = { path = "/git/github.com/LiGoldragon/signal-spirit", features = ["datom"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
triad-runtime = { git = "https://github.com/LiGoldragon/triad-runtime.git", branch = "main" }
signal-introspect = { git = "https://github.com/LiGoldragon/signal-introspect.git", rev = "6e50a42a7f4e1350cc02be6ad032babee948c54e", default-features = false, optional = true }
