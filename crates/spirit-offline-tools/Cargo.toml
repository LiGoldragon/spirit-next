[package]
name = "spirit-offline-tools"
version = "0.27.0"
edition = "2024"
publish = false

[[bin]]
name = "spirit-write-configuration"
path = "src/write_configuration.rs"

[[bin]]
name = "spirit-migrate-store"
path = "src/migrate_store.rs"

[dependencies]
spirit = { path = "../..", default-features = false, features = ["datom-cli", "production-migration"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "f2cc06858d38a4028c928d33323a6d682e7c222f" }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "b543678cfc8609529cea7174eb4af8a64daa54ad" }
signal-spirit = { path = "/git/github.com/LiGoldragon/signal-spirit", features = ["datom"] }
rkyv = { version = "0.8", features = ["bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
thiserror = "2"
